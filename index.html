<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Happy Beginner</title>
<meta name="description" content="Happy Beginner — AI for Electronic Design Automation"/>
<style>
    :root {
      --bg: #0a0a0b;
      --text: #e8e8e6;
      --muted: #5c6470;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Courier New", monospace;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 32px;
      font-size: 14px;
      letter-spacing: 0.02em;
    }
    .nav-brand {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 26px; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      transition: color .2s ease;
    }
    .nav-links a:hover { color: var(--text); }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
    }
    .title {
      font-size: clamp(2.4rem, 8vw, 4.8rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      line-height: 1.15;
      text-align: center;
    }
    @media (max-width: 640px) {
      nav { flex-direction: column; gap: 14px; align-items: flex-start; }
      .nav-links { flex-wrap: wrap; gap: 18px; }
    }
</style>
</head>
<body>
  <nav>
    <span class="nav-brand">Happy&thinsp;Beginner</span>
    <div class="nav-links">
      <a href="/agenticeda/">AgenticEDA Survey</a>
    </div>
  </nav>
  <main>
    <div class="title">Happy Beginner</div>
  </main>
</body>
</html>
