<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Future EDA</title>
<meta name="description" content="Future EDA — AI for Electronic Design Automation"/>
<style>
    :root {
      --bg: #0a0a0b;
      --text: #e8e8e6;
      --muted: #5c6470;
      --accent: #8fb0ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Courier New", monospace;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 32px;
      font-size: 14px;
      letter-spacing: 0.02em;
    }
    .nav-brand {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 26px; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      transition: color .2s ease;
    }
    .nav-links a:hover { color: var(--text); }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
    }
    .typewriter {
      font-size: clamp(2.6rem, 9vw, 5.2rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
    }
    .cursor {
      display: inline-block;
      width: 0.52em;
      height: 0.92em;
      margin-left: 0.06em;
      background: var(--accent);
      vertical-align: -0.05em;
      animation: blink 1.05s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @media (max-width: 640px) {
      nav { flex-direction: column; gap: 14px; align-items: flex-start; }
      .nav-links { flex-wrap: wrap; gap: 18px; }
    }
</style>
</head>
<body>
  <nav>
    <span class="nav-brand">Future&thinsp;EDA</span>
    <div class="nav-links">
      <a href="/agenticeda/">AgenticEDA Survey</a>
    </div>
  </nav>
  <main>
    <div class="typewriter"><span id="typed"></span><span class="cursor" aria-hidden="true"></span></div>
  </main>
  <script>
    (function () {
      const text = "Future EDA";
      const el = document.getElementById("typed");
      let i = 0;
      function type() {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          i += 1;
          setTimeout(type, 130 + Math.random() * 90);
        }
      }
      window.addEventListener("load", function () {
        setTimeout(type, 350);
      });
    })();
  </script>
</body>
</html>
